  ${s.tag}`;let c=document.getElementById('heroContent');c.classList.remove('swap');void c.offsetWidth;c.classList.add('swap')}function show(n,manual=false){idx=(n+slides.length)%slides.length;document.querySelectorAll('.slide').forEach((e,i)=>e.classList.toggle('active',i===idx));document.querySelectorAll('.dot').forEach((e,i)=>e.classList.toggle('active',i===idx));renderSlide();if(manual)restart()}function restart(){clearInterval(timer);timer=setInterval(()=>show(idx+1),5500)}document.querySelector('.next').onclick=()=>show(idx+1,true);document.querySelector('.prev').onclick=()=>show(idx-1,true);function setLang(l){current=t[l]?l:'az';document.documentElement.lang=current;document.querySelectorAll('[data-i]').forEach(e=>{if(t[current][e.dataset.i]!=null)e.textContent=t[current][e.dataset.i]});['name','email','company','message'].forEach(id=>document.getElementById(id).placeholder=t[current][id]);document.getElementById('lang').value=current;localStorage.setItem('fn-lang',current);renderSlide()}document.getElementById('lang').onchange=e=>setLang(e.target.value);setLang(current);restart();const o=new IntersectionObserver(es=>es.forEach(x=>x.isIntersecting&&x.target.classList.add('on')),{threshold:.12});document.querySelectorAll('.reveal').forEach(x=>o.observe(x));</script></body></html>
